<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#21132f"/>
  <meta name="description" content="Một cây kem ngọt, một Twinkle nhỏ xinh. Một món quà dành riêng cho Kem."/>
  <title>Kem & một vì sao nhỏ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{color-scheme:dark;--cream:#fff0dc;--pink:#f0b6cc;--muted:#cfbbd0;--viewport-height:100vh}
    @supports(height:100svh){:root{--viewport-height:100svh}}
    @supports(height:100dvh){:root{--viewport-height:100dvh}}
    html{min-height:100%;background:#21132f;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{margin:0;min-height:var(--viewport-height);overflow-x:hidden;color:var(--cream);font-family:'Nunito',sans-serif;
      background:radial-gradient(ellipse at 72% 48%,#53304466,transparent 48%),radial-gradient(ellipse at 15% 5%,#3c244755,transparent 45%),#21132f}
    button,a{-webkit-tap-highlight-color:transparent}
    button{font:inherit}
    a{color:inherit}
    a:focus-visible,button:focus-visible{outline:2px solid #ffe7ac;outline-offset:6px}
    .sky,.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none}
    .sky{z-index:0}
    .sky i{position:absolute;width:var(--size);height:var(--size);border-radius:50%;background:#fae1d4;opacity:.25;animation:twinkle var(--duration) ease-in-out infinite var(--delay)}
    @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.65;transform:scale(1.15)}}
    .page{position:relative;z-index:1;display:flex;flex-direction:column;min-height:var(--viewport-height);
      padding:max(20px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px))}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:1120px;margin:0 auto}
    .back{display:inline-flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;font-size:13px;color:var(--muted);transition:color .2s}
    .back:hover{color:var(--cream)}
    .back svg{width:17px;height:17px}
    .nav-note{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;color:#d6c0cd}
    .nav-note span{color:#f0d49d;font-size:16px}
    .gift{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-rows:1fr auto 1fr;column-gap:16px;
      width:100%;max-width:1080px;flex:1;margin:0 auto;padding:30px 0}
    .gift-copy{grid-column:1;grid-row:1;align-self:end;padding-left:24px}
    .eyebrow{margin:0 0 21px;color:#d6b8c7;font-size:10px;font-weight:700;line-height:1.8;letter-spacing:.22em;text-transform:uppercase}
    h1{margin:0;font-family:'Dancing Script',cursive;font-size:clamp(3.6rem,6.3vw,5.5rem);font-weight:600;line-height:1.08;letter-spacing:-.025em}
    h1 .name{color:var(--pink)}
    .intro{margin:23px 0 0;color:var(--muted);font-size:14px;line-height:1.95;font-weight:400}
    .stage{position:relative;grid-column:2;grid-row:1/-1;align-self:center;width:100%;margin:0;isolation:isolate}
    .stage::before{content:'';position:absolute;inset:12% 3% 5%;z-index:-1;border-radius:50%;background:radial-gradient(ellipse,#ce8ca925,transparent 68%);filter:blur(12px)}
    .illustration{animation:float 6s ease-in-out infinite;transform-origin:50% 75%}
    .illustration img{display:block;width:100%;height:auto;filter:drop-shadow(0 20px 22px #11081d44)}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-10px) rotate(.7deg)}}
    .stage figcaption{margin:3px 0 0;text-align:center;color:#cdb6c7;font-size:11px;letter-spacing:.05em;line-height:1.7}
    .little-star{position:absolute;width:18px;height:18px;color:#f7d58f;filter:drop-shadow(0 0 9px #f5c78144);animation:shimmer 4s ease-in-out infinite;pointer-events:none}
    .little-star.one{top:14%;right:14%;animation-delay:-1s}
    .little-star.two{top:50%;left:3%;width:12px;height:12px;animation-delay:-2.5s}
    @keyframes shimmer{0%,100%{opacity:.3;transform:scale(.7) rotate(-8deg)}50%{opacity:1;transform:scale(1) rotate(8deg)}}
    .gift-action{grid-column:1;grid-row:2;align-self:start;padding:30px 0 0 24px}
    .wish-button{display:inline-flex;justify-content:center;align-items:center;gap:11px;min-height:48px;padding:13px 22px;border:1px solid #f9c9d799;border-radius:999px;
      background:linear-gradient(135deg,#f2c4d3,#e4a6c1);color:#48283e;font-size:13px;font-weight:700;box-shadow:0 6px 30px #e5a7c11a;cursor:pointer;touch-action:manipulation;transition:transform .2s,box-shadow .2s}
    .wish-button svg{width:17px;height:17px;flex:none}
    .wish-button:hover{transform:translateY(-2px);box-shadow:0 8px 30px #e5a7c133}
    .wish-button:active{transform:scale(.97)}
    .wish{max-width:330px;min-height:48px;margin:15px 0 0;color:#d1b7c9;font-size:12px;line-height:1.9}
    .wish.received{color:#ffe0b4}
    .footer{margin:0;text-align:center;color:#b49bb8;font-family:'Dancing Script',cursive;font-size:17px;line-height:1.5}
    .footer span{padding:0 8px;color:#e5bf83;font-size:10px}
    .confetti{z-index:10}
    .confetti svg{position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);color:var(--color);animation:starburst 1.5s ease-out both}
    @keyframes starburst{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.6) rotate(var(--rotation))}}
    @media(max-width:700px){
      .page{padding: max(16px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
      .nav-note{font-size:9px;letter-spacing:.1em}
      .back{font-size:12px}
      .gift{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:24px 0 22px}
      .gift-copy{padding:0;text-align:center;align-self:center}
      .eyebrow{font-size:9px;letter-spacing:.18em;margin-bottom:12px}
      h1{font-size:clamp(2.8rem,10.5vw,4rem);line-height:1.12}
      .intro{font-size:12px;line-height:1.85;margin-top:16px}
      .stage{width:min(100%,400px);margin:6px 0 0}
      .stage figcaption{margin-top:-3px;font-size:10px}
      .gift-action{padding:22px 0 0;align-self:center;text-align:center;width:100%}
      .wish-button{min-height:48px;font-size:12px;padding-inline:20px}
      .wish{margin:12px auto 0;min-height:42px;font-size:11px;max-width:290px}
      .footer{font-size:15px}
    }
    @media(max-width:360px){.page{padding-inline:14px}.nav-note{letter-spacing:.03em}.intro{font-size:11px}h1{font-size:2.7rem}}
    @media(max-height:520px) and (orientation:landscape){
      .page{padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
      .gift{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto;gap:0 20px;padding:8px 0}
      .gift-copy{grid-column:1;grid-row:1;align-self:end;text-align:left;padding-left:8px}
      .eyebrow{font-size:8px;margin-bottom:7px}
      h1{font-size:clamp(2.2rem,5.3vw,3rem);line-height:1.05}
      .intro{font-size:10px;line-height:1.6;margin-top:10px}
      .stage{grid-column:2;grid-row:1/-1;align-self:center;margin:0 auto;width:min(100%,calc(var(--viewport-height) - 95px))}
      .stage figcaption{font-size:9px}
      .gift-action{grid-column:1;grid-row:2;align-self:start;text-align:left;padding:12px 0 0 8px}
      .wish-button{min-height:44px;padding:10px 16px;font-size:11px}
      .wish{font-size:10px;line-height:1.6;min-height:32px;margin:8px 0 0}
      .footer{font-size:13px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.sky i{opacity:.3}.confetti{display:none}}
  </style>
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <div class="page">
    <nav class="nav" aria-label="Điều hướng">
      <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h13" stroke-linecap="round" stroke-linejoin="round"/></svg>Bó hoa của Kem</a>
      <div class="nav-note"><span aria-hidden="true">✦</span>MỘT MÓN QUÀ NHỎ</div>
    </nav>
    <main class="gift">
      <header class="gift-copy">
        <p class="eyebrow">Dành riêng cho một bạn tên là Kem</p>
        <h1><span class="name">Kem</span> &<br>một vì sao nhỏ.</h1>
      </header>
      <figure class="stage">
        <div class="illustration"><img src="image/kem-twinkle.png" width="1254" height="1254" alt="Twinkle mặc áo hồng kem, má hình trái tim, đang ôm một cây kem ốc quế dâu và vani; ngôi sao nhỏ nằm trên chóp mũ." fetchpriority="high" decoding="async"/></div>
        <svg class="little-star one" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 0 3.3 8.7L24 12l-8.7 3.3L12 24l-3.3-8.7L0 12l8.7-3.3Z"/></svg>
        <svg class="little-star two" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 0 3.3 8.7L24 12l-8.7 3.3L12 24l-3.3-8.7L0 12l8.7-3.3Z"/></svg>
        <figcaption>Vị dâu, vị vani & một chút lấp lánh.</figcaption>
      </figure>
      <div class="gift-action">
        <button class="wish-button" id="wish-button" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="m12 2 2.9 6.5L22 9.3l-5.3 4.8 1.5 7-6.2-3.6-6.2 3.6 1.5-7L2 9.3l7.1-.8Z" stroke-linejoin="round"/></svg><span id="button-copy">Nhận một ngôi sao</span></button>
        <p class="wish" id="wish" role="status" aria-live="polite">Có một điều nhỏ xinh đang chờ Kem.</p>
      </div>
    </main>
    <p class="footer"><span aria-hidden="true">✦</span>Thêm một chút ngọt ngào cho ngày của Kem.<span aria-hidden="true">✦</span></p>
  </div>
  <script>
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const sky = document.getElementById('sky');
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < 32; i++) {
      const star = document.createElement('i');
      star.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--size:${1+Math.random()*2}px;--duration:${3+Math.random()*4}s;--delay:-${Math.random()*7}s`;
      fragment.appendChild(star);
    }
    sky.appendChild(fragment);
    const messages = [
      'Kem luôn xứng đáng với những điều nhẹ nhàng. ✨',
      'Gửi Kem một ngôi sao nhỏ, để hôm nay sáng hơn một chút. ⭐',
      'Mong Kem có thật nhiều niềm vui, và một cây kem thật ngon. 🍦',
      'Cứ là Kem thôi, đã đủ đáng yêu rồi. 🌷'
    ];
    const button = document.getElementById('wish-button');
    const wish = document.getElementById('wish');
    const confetti = document.getElementById('confetti');
    const colors = ['#f4bfd4','#ffe1a0','#d6bee9','#fff0df'];
    let messageIndex = 0;
    button.addEventListener('click', () => {
      wish.textContent = messages[messageIndex % messages.length];
      messageIndex++;
      wish.classList.add('received');
      document.getElementById('button-copy').textContent = 'Thêm một ngôi sao';
      if (reducedMotion.matches) return;
      // Replace the previous burst to keep rapid taps light on mobile devices.
      confetti.replaceChildren();
      const bounds = button.getBoundingClientRect();
      for (let i = 0; i < 18; i++) {
        const star = document.createElementNS('http://www.w3.org/2000/svg','svg');
        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        const angle = (i/18)*Math.PI*2;
        const distance = 60+Math.random()*100;
        star.setAttribute('viewBox','0 0 24 24');
        star.setAttribute('fill','currentColor');
        path.setAttribute('d','m12 0 3.3 8.7L24 12l-8.7 3.3L12 24l-3.3-8.7L0 12l8.7-3.3Z');
        star.appendChild(path);
        star.style.cssText = `--x:${bounds.left+bounds.width/2}px;--y:${bounds.top+bounds.height/2}px;--size:${8+Math.random()*10}px;--color:${colors[i%colors.length]};--dx:${Math.cos(angle)*distance}px;--dy:${Math.sin(angle)*distance-55}px;--rotation:${Math.random()*240}deg`;
        star.addEventListener('animationend',()=>star.remove(),{once:true});
        confetti.appendChild(star);
      }
    });
    reducedMotion.addEventListener('change',()=>confetti.replaceChildren());
  </script>
</body>
</html>
