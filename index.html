<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#180c2a"/>
  <meta name="description" content="Một bó hoa nhỏ, dành tặng kem."/>
  <title>Bó Hoa Tươi Đẹp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{--viewport-height:100vh;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    @supports(height:100svh){:root{--viewport-height:100svh}}
    @supports(height:100dvh){:root{--viewport-height:100dvh}}
    html{min-height:100%;background:#180c2a;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{margin:0;min-height:var(--viewport-height);overflow-x:hidden;color:#fff4f7;font-family:'Dancing Script',cursive;
      background:radial-gradient(ellipse at 50% 43%,#35203f 0%,#241332 38%,#160b25 76%)}
    .stars,.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden}
    .star{position:absolute;border-radius:50%;background:#ffe3f1;opacity:0;animation:twinkle var(--duration) ease-in-out infinite var(--delay)}
    @keyframes twinkle{0%,100%{opacity:.1;transform:scale(.7)}50%{opacity:.65;transform:scale(1.15)}}
    .petal-fall{position:absolute;top:-24px;border-radius:65% 35% 65% 35%;opacity:0;animation:drift var(--duration) linear infinite var(--delay)}
    @keyframes drift{0%{opacity:0;transform:translate3d(0,-20px,0) rotate(0)}10%{opacity:.5}85%{opacity:.35}100%{opacity:0;transform:translate3d(65px,110vh,0) rotate(420deg)}}
    .scene{position:relative;z-index:1;width:100%;min-height:var(--viewport-height);display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:max(24px,var(--safe-top)) max(16px,env(safe-area-inset-right,0px)) max(28px,var(--safe-bottom)) max(16px,env(safe-area-inset-left,0px));isolation:isolate}
    .title{display:flex;align-items:center;justify-content:center;gap:clamp(5px,1.2vw,12px);max-width:100%;margin:0 0 8px;text-align:center;font-size:clamp(1.8rem,4.3vw,3rem);font-weight:700;line-height:1.3;text-shadow:0 0 28px #f3a6cf66}
    .title-copy{min-width:0;text-wrap:balance}
    .title-flower{flex:none;font-size:.62em}
    .bouquet-interaction{width:100%;width:min(100%,540px,calc((var(--viewport-height) - var(--safe-top) - var(--safe-bottom) - 225px)*.828571));flex:none;transform:perspective(1000px) rotateY(var(--tilt-x,0deg)) rotateX(var(--tilt-y,0deg));transition:transform .25s ease-out}
    .bouquet-sway{transform-origin:50% 86%;animation:sway 6s ease-in-out infinite}
    @keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
    #svgBouquet{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 24px 25px #08031355)}
    .bloom{transform-box:fill-box;transform-origin:center;animation:bloomIn 1s cubic-bezier(.2,.7,.3,1) both;animation-delay:var(--delay,0s)}
    @keyframes bloomIn{from{opacity:0;transform:scale(.65) rotate(-7deg)}to{opacity:1;transform:scale(1) rotate(0)}}
    .glint{transform-box:fill-box;transform-origin:center;animation:glimmer 4s ease-in-out infinite var(--delay)}
    @keyframes glimmer{0%,30%,100%{opacity:0;transform:scale(.5) rotate(0)}50%,60%{opacity:.85;transform:scale(1) rotate(30deg)}}
    .subtitle{max-width:100%;margin:8px 0 0;text-align:center;text-wrap:balance;font-size:clamp(1.1rem,2.5vw,1.4rem);font-weight:600;line-height:1.5;color:#e9c2d3;text-shadow:0 0 18px #f8c6db33}
    .subtitle span{font-size:.65em;color:#e9c58a;vertical-align:12%;margin:0 .6em}
    .next-gift{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;margin-top:14px;padding:8px 17px;border:1px solid #edbdd52e;border-radius:999px;color:#eac4d7;background:#e4afcb08;font:500 12px system-ui,sans-serif;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:background .2s,border-color .2s}
    .next-gift:hover{background:#e4afcb18;border-color:#edbdd566}
    .next-gift:focus-visible{outline:2px solid #ffe0a4;outline-offset:5px}
    .next-gift span{color:#f2d39a}
    @media(max-width:600px){
      .scene{padding-top:max(16px,var(--safe-top));padding-bottom:max(20px,var(--safe-bottom));padding-right:max(12px,env(safe-area-inset-right,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
      .title{font-size:clamp(1.45rem,6.8vw,2.2rem)}
      .bouquet-interaction{width:min(100%,540px,calc((var(--viewport-height) - var(--safe-top) - var(--safe-bottom) - 185px)*.828571))}
      .subtitle{font-size:clamp(1rem,4.4vw,1.25rem)}
      #svgBouquet{filter:drop-shadow(0 14px 16px #08031355)}
    }
    @media(max-height:520px) and (orientation:landscape){
      .scene{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);grid-template-rows:1fr auto auto 1fr;column-gap:16px;
        padding-top:max(12px,var(--safe-top));padding-bottom:max(12px,var(--safe-bottom))}
      .title{grid-column:1;grid-row:2;align-self:end;justify-self:center;margin-bottom:10px;font-size:clamp(1.4rem,4vw,2.15rem)}
      .subtitle{grid-column:1;grid-row:3;align-self:start;justify-self:center;margin-top:0;font-size:clamp(1rem,2.3vw,1.2rem)}
      .next-gift{grid-column:1;grid-row:4;align-self:start;justify-self:center;margin-top:12px}
      .bouquet-interaction{grid-column:2;grid-row:1/-1;justify-self:center;width:min(100%,calc((var(--viewport-height) - var(--safe-top) - var(--safe-bottom) - 32px)*.828571))}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.star{opacity:.35}.petal-fall,.glint{display:none}.bloom{opacity:1;transform:none}.bouquet-interaction{transform:none}}
  </style>
</head>

  <script>
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    const compactScreen = window.matchMedia('(max-width: 600px), (pointer: coarse)').matches;
    const stars = document.getElementById('stars');
    const petals = document.getElementById('petals');
    const starFragment = document.createDocumentFragment();
    for (let i = 0; i < (compactScreen ? 36 : 65); i++) {
      const star = document.createElement('i');
      const size = 1 + Math.random() * 2;
      star.className = 'star';
      star.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--duration:${3+Math.random()*4}s;--delay:-${Math.random()*7}s`;
      starFragment.appendChild(star);
    }
    stars.appendChild(starFragment);
    if (!motionPreference.matches) {
      const colors = ['#edb5cc','#d3bddf','#f5d6cd','#e8cfa4'];
      const petalFragment = document.createDocumentFragment();
      for (let i = 0; i < (compactScreen ? 8 : 12); i++) {
        const petal = document.createElement('i');
        petal.className = 'petal-fall';
        petal.style.cssText = `left:${Math.random()*100}%;width:${6+Math.random()*6}px;height:${9+Math.random()*6}px;background:${colors[i%colors.length]};--duration:${10+Math.random()*9}s;--delay:-${Math.random()*20}s`;
        petalFragment.appendChild(petal);
      }
      petals.appendChild(petalFragment);
    }
    // Pointer tilt and idle sway affect separate wrappers, so neither replaces the other.
    const bouquet = document.getElementById('bouquet');
    const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
    let pointerFrame = 0;
    let pointerX = 0;
    let pointerY = 0;
    const resetTilt = () => {
      cancelAnimationFrame(pointerFrame);
      pointerFrame = 0;
      bouquet.style.removeProperty('--tilt-x');
      bouquet.style.removeProperty('--tilt-y');
    };
    window.addEventListener('pointermove', event => {
      if (motionPreference.matches || !finePointer.matches || event.pointerType === 'touch') return;
      pointerX = event.clientX;
      pointerY = event.clientY;
      if (pointerFrame) return;
      pointerFrame = requestAnimationFrame(() => {
        bouquet.style.setProperty('--tilt-x', `${(pointerX/innerWidth-.5)*5}deg`);
        bouquet.style.setProperty('--tilt-y', `${(.5-pointerY/innerHeight)*3}deg`);
        pointerFrame = 0;
      });
    }, {passive:true});
    document.documentElement.addEventListener('pointerleave', resetTilt);
    window.addEventListener('blur', resetTilt);
    motionPreference.addEventListener('change', resetTilt);
  </script>
